name: fix_up_moto
description: "Motorcycle repair and service booking application."
publish_to: 'none'
version: 2.3.0+21

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # ── State Management ──────────────────────────────────────────────────────
  # flutter_bloc: BlocProvider, BlocBuilder, BlocListener widget helpers
  flutter_bloc: ^9.1.1
  # bloc: core Bloc/Cubit classes (flutter_bloc depends on this)
  bloc: ^9.2.1

  # ── Dependency Injection ──────────────────────────────────────────────────
  # get_it: service locator — register once, resolve anywhere via sl<Type>()
  get_it: ^9.2.1

  # ── Value Equality ────────────────────────────────────────────────────────
  # equatable: overrides == and hashCode via props list — used in entities,
  # states, and events so BLoC only rebuilds on genuine state changes
  equatable: ^2.0.5

  # ── HTTP Networking ───────────────────────────────────────────────────────
  # dio: feature-rich HTTP client with interceptor support for auth tokens
  dio: ^5.7.0

  # ── Navigation ────────────────────────────────────────────────────────────
  # go_router: Flutter-team-endorsed declarative router with deep linking
  # and ShellRoute for persistent bottom navigation bar
  go_router: ^18.0.1

  # ── Local Storage ─────────────────────────────────────────────────────────
  # shared_preferences: key-value store for non-sensitive settings
  shared_preferences: ^2.3.3
  # flutter_secure_storage: OS keychain/keystore for auth tokens
  flutter_secure_storage: ^11.1.1
  # path_provider: finds the cache and app-support folders, so the 2.0 first
  # launch can delete the image cache that 1.0 left behind (LocalDataReset)
  path_provider: ^2.1.5

  # ── Functional Error Handling ─────────────────────────────────────────────
  # dartz: provides Either<Failure, T> — forces callers to handle both
  # error and success paths without leaking exceptions across layers
  dartz: ^0.10.1

  # ── Code Generation Annotations ──────────────────────────────────────────
  # freezed_annotation: @freezed decorator for immutable data classes/unions
  freezed_annotation: ^3.1.0
  # json_annotation: @JsonSerializable for fromJson/toJson code generation
  json_annotation: ^4.9.0

  # ── Utilities ─────────────────────────────────────────────────────────────
  # intl: date formatting ("Mon, 10 Mar 2026"), number/currency formatting
  intl: ^0.20.2

  # ── Third-party Sign-In ───────────────────────────────────────────────────
  # google_sign_in: Google account authentication.
  # NOTE: 7.x rewrote the API — signIn() is now authenticate(), signInSilently()
  # is attemptLightweightAuthentication(), currentUser is gone, and
  # GoogleSignIn.instance is a singleton that must have initialize() awaited
  # once before any other call. Any 6.x snippet found online will not compile.
  google_sign_in: ^7.2.0
  firebase_core: ^4.14.0

  # ── Media ─────────────────────────────────────────────────────────────────
  # video_player: official Flutter-team plugin (ExoPlayer/AVPlayer under the
  # hood) — the playback engine every Reels/TikTok/Shorts-style feed is built
  # on. The vertical swipe/autoplay behaviour around it is hand-built in
  # features/feeds, following the common real-world pattern rather than a
  # smaller, less-maintained wrapper package.
  video_player: ^2.9.2
  # url_launcher: opens a post's Instagram permalink in the browser/app.
  url_launcher: ^6.3.1
  # image_picker: gallery-only photo selection on Add Bike — pickImage is
  # called with source: ImageSource.gallery, never .camera.
  image_picker: ^1.2.3
  # geolocator: where the member is, only to find the nearest workshops (the
  # booking default and the workshop list's order; core/services/
  # location_service.dart). Coarse, while-in-use location; never stored or sent.
  geolocator: ^14.1.2

  # ── UI ────────────────────────────────────────────────────────────────────
  # sliding_up_panel: the advanced-filter panel on the Bookings tab, and the
  # confirmation panels (ConfirmPanelScope) that replace dialogs on Profile.
  sliding_up_panel: ^2.0.0+1
  # qr_flutter: draws the member QR on the Membership page, locally (no network).
  qr_flutter: ^4.1.0
  # screen_brightness: raises the screen to full brightness while the member QR
  # is enlarged, so a cashier's scanner can read it; restored on close.
  screen_brightness: ^2.1.11
  # share_plus: the Feeds tab's share button — opens the phone's share sheet with
  # a reel's caption and Instagram link.
  share_plus: ^13.3.1
  font_awesome_flutter: ^11.0.0
  # file_saver: writes a downloaded receipt PDF into the phone's Download folder
  # (Android, through MediaStore — no permission on Android 10+) or the app's
  # folder in the Files app (iOS), with no dialog.
  file_saver: ^0.7.0
  firebase_messaging: ^16.7.1
  device_info_plus: ^13.3.0
  flutter_local_notifications: ^22.3.3
  workmanager: ^0.10.10
  # tutorial_coach_mark: the first-run app tour (lib/core/tour) — a dark overlay
  # that lights up one bottom-bar tab at a time. It only needs a GlobalKey on
  # each tab, so no page had to be wrapped in the package's own widgets.
  tutorial_coach_mark: ^1.3.4
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # ── Code Generators ───────────────────────────────────────────────────────
  # build_runner: runs code generation; execute with:
  #   dart run build_runner build --delete-conflicting-outputs
  build_runner: ^2.4.13
  # freezed: generates copyWith, ==, toString, pattern-matching for @freezed classes
  freezed: ^4.0.1
  # json_serializable: generates _$ClassFromJson / _$ClassToJson functions
  json_serializable: ^6.8.0

  # ── Testing ───────────────────────────────────────────────────────────────
  # bloc_test: whenListen, blocTest helpers for BLoC unit tests
  bloc_test: ^10.0.0
  # mocktail: null-safe mock generation without code generation
  mocktail: ^1.0.4

  # ── App Icon ──────────────────────────────────────────────────────────────
  # flutter_launcher_icons: writes the Android and iOS launcher icons from the
  # logo, configured in the flutter_launcher_icons block below. Re-run after
  # changing it with:
  #   dart run flutter_launcher_icons
  flutter_launcher_icons: ^0.14.4

# Launcher icons for Android (adaptive) and iOS only, each with its own artwork.
# Web, Windows and macOS keep Flutter's default icons — this is a phone app.
flutter_launcher_icons:
  # iOS: the 1600x1600 FixUp Moto logo, white text on solid red.
  image_path: "assets/images/fixupmoto_logo.jpg"
  # Android: the "My Fixup Call" icon (1082x1082), the lower part of
  # new_android_logo.jpeg only (headset and "My Fixup Call"; the FiXUP MOTO
  # wordmark and tagline above are left out), centred, copied 1:1, with its
  # slightly uneven red made one flat colour.
  # It sits outside assets/images/ so it isn't bundled into the app.
  image_path_android: "assets/launcher/android_icon.png"

  android: "ic_launcher"
  min_sdk_android: 21
  # Adaptive icon (Android 8+): a red plate with the artwork on it. #F50302 is
  # the artwork's own red, so the two read as one. The artwork is pulled in by
  # the inset so all of it stays inside the circle or rounded square the
  # phone's launcher cuts the icon to: at 20 it reaches 32.4dp from the centre
  # (safe zone 33dp). The canvas size is chosen for this inset, so change the
  # two together.
  adaptive_icon_background: "#F50302"
  adaptive_icon_foreground: "assets/launcher/android_icon.png"
  adaptive_icon_foreground_inset: 20

  ios: true
  # The App Store rejects an icon with transparency.
  remove_alpha_ios: true

flutter:
  uses-material-design: true

  assets:
    # Drop images (PNG/JPG/SVG) here — referenced via AssetConstants.imagePath
    - assets/images/
    # App-specific icons (SVG/PNG) separate from Material icon font
    - assets/icons/
    # Lottie JSON animation files
    - assets/animations/
    # Markdown Fima answers from when the chat service cannot (ChatConstants)
    - assets/knowledge/

  fonts:
    # Poppins — primary typeface; weights map to TextStyle fontWeight values
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf          # w400 — body text
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500                                        # w500 — labels
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600                                        # w600 — subheadings
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700                                        # w700 — headings

plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
    id "com.google.gms.google-services"
}

// ── Release signing ─────────────────────────────────────────────────────────
// Credentials live in android/key.properties, which is gitignored — the
// keystore and its passwords must never enter version control.
//
// Both `keystoreProperties` and `hasReleaseKeystore` below are resolved by
// Groovy at configuration time, so the signingConfigs and buildTypes blocks
// cannot be read before them. Removing or commenting either one fails the
// build with "Could not get unknown property '<name>'".
//
// When key.properties is absent the build falls back to debug signing rather
// than failing, so `flutter build apk --release` still works for anyone who
// does not hold the keystore.
def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
// Referenced by both signingConfigs and buildTypes.release below. Without it
// Gradle fails configuration with
// "Could not get unknown property 'hasReleaseKeystore'".
def hasReleaseKeystore = keystorePropertiesFile.exists()
if (hasReleaseKeystore) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace = "com.stsj.fixupmotoapps"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17.toString()
    }

    defaultConfig {
        // Permanent public identity of the app. Cannot be changed after the
        // first Play Store release without shipping a different app entirely.
        applicationId = "com.stsj.fixupmotoapps"
        minSdk = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    signingConfigs {
        // Only declared when the credentials exist — referencing a keystore
        // that isn't there would break the build for everyone else.
        if (hasReleaseKeystore) {
            create("release") {
                storeFile file(keystoreProperties["storeFile"])
                storePassword keystoreProperties["storePassword"]
                keyAlias keystoreProperties["keyAlias"]
                keyPassword keystoreProperties["keyPassword"]
            }
        }
    }

    buildTypes {
        release {
            // Explicit `=` assignment rather than method-call syntax, so the
            // ternary is unambiguous to the Groovy parser.
            signingConfig = hasReleaseKeystore
                ? signingConfigs.getByName("release")
                : signingConfigs.getByName("debug")

            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }
}

flutter {
    source = "../.."
}

dependencies {
  // Import the Firebase BoM
  implementation platform('com.google.firebase:firebase-bom:34.18.0')


  // TODO: Add the dependencies for Firebase products you want to use
  // When using the BoM, don't specify versions in Firebase dependencies
  implementation 'com.google.firebase:firebase-analytics'


  // Add the dependencies for any other desired Firebase products
  // https://firebase.google.com/docs/android/setup#available-libraries
}